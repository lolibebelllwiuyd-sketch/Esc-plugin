name: Build ZEIN SMP Resource Pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Package Resource Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate resource pack
        run: |
          test -f pack.mcmeta
          test -d assets

      - name: Create resource pack ZIP
        run: |
          zip -r ZeinSMP-ResourcePack.zip assets default.json pack.mcmeta

      - name: Upload resource pack
        uses: actions/upload-artifact@v4
        with:
          name: ZeinSMP-ResourcePack
          path: ZeinSMP-ResourcePack.zip
          if-no-files-found: error
