name: Build ZEIN SMP Resource Pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package Resource Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Minecraft 1.21.11 resource pack
        run: |
          test -f pack.mcmeta
          test -f assets/minecraft/font/default.json
          test -f assets/minecraft/textures/font/zein_title.png
          test -d assets/minecraft/textures/gui/sprites/widget
          python -m json.tool pack.mcmeta > /dev/null
          python -m json.tool assets/minecraft/font/default.json > /dev/null
          grep -q '"min_format": 75' pack.mcmeta
          grep -q '"max_format": 75' pack.mcmeta

      - name: Create resource pack ZIP
        run: |
          rm -f ZeinSMP-ResourcePack.zip
          zip -r ZeinSMP-ResourcePack.zip pack.mcmeta assets
          unzip -l ZeinSMP-ResourcePack.zip
          echo "SHA1=$(sha1sum ZeinSMP-ResourcePack.zip | cut -d ' ' -f 1)" >> "$GITHUB_ENV"

      - name: Upload resource pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeinSMP-ResourcePack
          path: ZeinSMP-ResourcePack.zip
          if-no-files-found: error

      - name: Replace the public GitHub Release download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload Texture ZeinSMP-ResourcePack.zip --clobber
          echo "Updated release asset SHA-1: $SHA1" >> "$GITHUB_STEP_SUMMARY"
