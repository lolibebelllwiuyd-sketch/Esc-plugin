name: Build ZEIN SMP Paper Plugin

on:
  push:
    paths:
      - 'paper-plugin/**'
      - '.github/workflows/build-paper-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build plugin
        working-directory: paper-plugin
        run: gradle clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: ZeinPack-Paper-1.21.11
          path: paper-plugin/build/libs/ZeinPack-1.0.0.jar
          if-no-files-found: error
